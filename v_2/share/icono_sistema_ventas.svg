<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Sistema de Ventas</title>
<desc>Icono de aplicación de punto de venta, en el lenguaje visual de los iconos de aplicación de LibreOffice: solo el documento con la esquina doblada (sin fondo detrás), con líneas de artículos y un código de barras. La sombra es una forma sólida, no un filtro, para que se vea igual en cualquier visor de iconos.</desc>

<defs>
<linearGradient id="pagina" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#FFFFFF"/>
<stop offset="100%" stop-color="#F6F9FA"/>
</linearGradient>
</defs>

<!-- Sombra: la misma silueta de la página, desplazada, como forma sólida (no un filtro:
     algunos visores de iconos de escritorio ignoran los filtros SVG en tamaños chicos). -->
<path d="M 62 26
         L 172 26
         L 202 56
         L 202 232
         Q 202 242 192 242
         L 62 242
         Q 52 242 52 232
         L 52 36
         Q 52 26 62 26 Z"
      fill="#0F2C36" opacity="0.22"/>

<!-- Página: documento con la esquina superior derecha doblada, blanco, con borde firme -->
<path d="M 58 20
         L 168 20
         L 198 50
         L 198 226
         Q 198 236 188 236
         L 58 236
         Q 48 236 48 226
         L 48 30
         Q 48 20 58 20 Z"
      fill="url(#pagina)" stroke="#9FB0B6" stroke-width="3"/>
<!-- Triángulo del doblez -->
<path d="M 168 20 L 168 50 L 198 50 Z" fill="#E4EAEC" stroke="#9FB0B6" stroke-width="3" stroke-linejoin="round"/>

<!-- Lomo de color, a la izquierda, como identidad de la aplicación -->
<rect x="48" y="20" width="9" height="216" rx="4" fill="#1C5D73"/>

<!-- Líneas de artículos (filas de un ticket/planilla) -->
<rect x="76" y="76"  width="96" height="9" rx="4.5" fill="#8FA0A8"/>
<rect x="76" y="98"  width="74" height="9" rx="4.5" fill="#B7C3C8"/>
<rect x="76" y="120" width="86" height="9" rx="4.5" fill="#B7C3C8"/>

<!-- Línea de total, en el color de acento -->
<rect x="76" y="148" width="96" height="11" rx="5.5" fill="#E0A93A"/>

<!-- Código de barras -->
<g fill="#25333A">
<rect x="76"  y="182" width="5" height="30"/>
<rect x="85"  y="182" width="3" height="30"/>
<rect x="92"  y="182" width="8" height="30"/>
<rect x="104" y="182" width="3" height="30"/>
<rect x="111" y="182" width="5" height="30"/>
<rect x="120" y="182" width="8" height="30"/>
<rect x="132" y="182" width="3" height="30"/>
<rect x="139" y="182" width="5" height="30"/>
<rect x="148" y="182" width="3" height="30"/>
<rect x="155" y="182" width="8" height="30"/>
<rect x="167" y="182" width="5" height="30"/>
</g>
</svg>
