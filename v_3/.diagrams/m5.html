    if (target.shape === "junction") {
      const owner = nodes.get(target.junctionOf);
      return owner && !owner.ref && !hasChildren(owner.id) ? owner : target;
    }
    return hasChildren(target.id) ? null : target;
  };
  let copies = 0;
  const copyOfLeaf = (leaf, e) => {
    const copy = { ...leaf, id: `${leaf.id}\u29c9${++copies}`, copyOf: leaf.id };
    if (leaf.shape !== "junction") copy.realId = leaf.realId || leaf.id; // un empalme se identifica por junctionOf
    delete copy.col;
    delete copy.row;
    nodes.set(copy.id, copy);
    for (const [k, id] of pending) if (id === `copy:${e.index}`) pending.set(k, copy.id);
    e.to = copy.id;
    return copy;
  };
  // Respaldo al final: flechas que no pasaron por expand (p. ej. de grupos reconstruidos). Los
  // empalmes que se quedan sin ramas se quitan.
  const copyLeaves = () => {
    for (const e of [...edges].sort((a, b) => a.index - b.index)) {
      if (e.bus || e.attached) continue;
      const u = nodes.get(e.from);
      const leaf = farLeaf(u, nodes.get(e.to));
      if (!leaf) continue;
      const side = [e.dir, ...sidesOf(u)].find((d) => d && !blocked(cellAt(u, d)));
      if (!side) continue;
      const copy = copyOfLeaf(leaf, e);
      e.dir = side;
      const v = DIR_VECTORS[side];
      place(copy, u.col + v.dc, u.row + v.dr, `copia de ${who(leaf)} junto a ${who(u)}, ${SIDE_AT[side]}: el original está lejos y no tiene hijos`);
    }
    pruneJunctions();
  };
  const pruneJunctions = () => {
    for (let removed = true; removed; ) {
      removed = false;
      for (const j of [...nodes.values()]) {
        if (j.shape !== "junction") continue;
        // Solo se quita un empalme que ya no tiene ramas: como mucho le queda la extensión que
        // llega (una copia de empalme tiene su flecha, que es una rama).
        const own = edges.filter((x) => x.from === j.id || x.to === j.id);
        if (own.length > 1 || own.some((x) => !x.bus)) continue;
        for (const x of own) edges.splice(edges.indexOf(x), 1);
        nodes.delete(j.id);
        occupied.delete(`${j.col},${j.row}`);
        removed = true;
      }
    }
  };

  // Revisión final: una flecha que haya quedado en diagonal o pasando por encima de un nodo (p. ej.
  // la del segundo padre de un nodo colocado junto al primero) termina en un punto junto a su
  // origen con la pastilla de su destino (● F3), como una copia de empalme. Si el origen no tiene
  // sitio se usa la cascada de siempre (placeNextTo).
  const badLine = (x) => {
    const a = nodes.get(x.from);
    const b = nodes.get(x.to);
    if (a.col !== b.col && a.row !== b.row) return true;
    const n = Math.abs(a.col - b.col) + Math.abs(a.row - b.row);
    const dc = Math.sign(b.col - a.col);
    const dr = Math.sign(b.row - a.row);
    for (let i = 1; i < n; i++) if (occupied.has(`${a.col + dc * i},${a.row + dr * i}`)) return true;
    return false;
  };
  const fixLongLinks = () => {
    let connectors = 0;
    for (const x of [...edges].sort((a, b) => a.index - b.index)) {
      if (x.bus || x.attached || !edges.includes(x)) continue;
      const u = nodes.get(x.from);
      const target = nodes.get(x.to);
      if (!u || !target || u.col === undefined || target.col === undefined || !badLine(x)) continue;
      const twin = twinNextTo(u, target);
      if (twin) {
        reuseTwin(x, u, twin, "en vez de un conector");
        continue;
      }
      const owner = target.junctionOf || target.realId || target.id;
      const dot = {
        id: `${target.id}\u2192${++connectors}`,
        shape: "junction",
        text: "",
        lines: [],
        w: pillWidth(junctionLabel(owner)),
        h: PILL_HEIGHT,
        lineHeight: target.lineHeight,
        line: x.line,
        group: target.group,
        junctionOf: owner,
        copyOf: target.id,
      };
      nodes.set(dot.id, dot);
      x.to = dot.id;
      placeNextTo(u, dot, x);
      dot.why = `conector hacia '${owner}': la flecha desde ${who(u)} quedaba en diagonal o pasaba por encima de un nodo. ${dot.why}`;
    }
    pruneJunctions();
  };

  // Fija la geometría de una arista sabiendo en qué lado de u está el otro extremo.
  const setSide = (e, u, side) => {
    if (e.attached) {
      e.slot = e.to === u.id ? side : OPPOSITE[side];
      e.dir = OPPOSITE[e.slot];
    } else e.dir = e.from === u.id ? side : OPPOSITE[side];
  };

  // Un nodo sin padre que todavía no puede pegarse a ningún hijo se aplaza: quizá otro grupo
  // coloque después alguno de sus hijos. Al final se reintenta hasta que no haya avances, y los
  // que sigan sin poder pegarse empiezan un grupo nuevo, en su orden.
  // Los nodos con padre que no se alcanzaron (ciclos) y las referencias sueltas van después de los
  // aplazados: un aplazado puede ser justo el padre que los alcanza.
  const waiting = [];
  const starts = roots.filter((n) => !n.ref && !hasIncoming.has(n.id));
  for (const root of starts) {
    if (root.col !== undefined || isAttachedRef(root)) continue;
    const anchor = findAnchor(root);
    if (!anchor && occupied.size) waiting.push(root);
    else placeRoot(root, anchor);
  }
  // Primero se reintenta el anclaje simple (el inicio junto a un hijo ya colocado); si no basta,
  // se reconstruye el grupo desde su primera conexión con lo ya colocado (placeGroupByLink).
  for (let progress = true; progress; ) {
    progress = false;
    for (const root of waiting) {
      if (root.col !== undefined) continue;
      const anchor = findAnchor(root);
      if (anchor) placeRoot(root, anchor, true);
      else if (!placeGroupByLink(root)) continue;
      progress = true;
    }
  }
  for (const root of waiting) if (root.col === undefined) placeRoot(root, null, true);
  for (const root of roots) {
    if (root.col !== undefined || isAttachedRef(root)) continue;
    placeRoot(root, findAnchor(root));
  }
  copyLeaves();
  fixLongLinks();
  history[step - 1] = snapshot(); // el último paso, ya con la limpieza de empalmes
  // Los empalmes que se quitaron al final (sin ramas) desaparecen de toda la historia y los pasos
  // se renumeran, para que el paso k siga teniendo k+1 nodos.
  const alive = new Set(nodes.keys());
  const keep = history.filter((h, k) => {
    const placedAt = h.pos.find(([n]) => n.step === k);
    return placedAt && alive.has(placedAt[0].id);
  });
  for (const h of keep) {
    h.pos = h.pos.filter(([n]) => alive.has(n.id));
    h.edges = h.edges.filter((x) => alive.has(x.from) && alive.has(x.to));
  }
  [...nodes.values()].sort((a, b) => a.step - b.step).forEach((n, i) => (n.step = i));
  return keep;
}

// ---------------------------------------------------------------- coordenadas

function computeCoordinates(nodes, edges, measure, opts) {
  const colWidth = new Map();
  const rowHeight = new Map();
  for (const n of nodes.values()) {
    colWidth.set(n.col, Math.max(colWidth.get(n.col) || 0, n.w));
    rowHeight.set(n.row, Math.max(rowHeight.get(n.row) || 0, n.h));
  }

  // Los huecos entre columnas/filas vecinas crecen si una etiqueta de arista no cabe.
  const colGapAfter = new Map();
  const rowGapAfter = new Map();
  for (const e of edges) {
    if (!e.label) continue;
    const a = nodes.get(e.from);
    const b = nodes.get(e.to);
    const tm = textMetrics(e.css, measure, opts);
    const labelLines = e.label.split("\n");
    const labelW = Math.max(...labelLines.map((l) => tm.measure(l))) + 24;
    const labelH = tm.lineHeight * labelLines.length + 16;
    if (a.row === b.row && Math.abs(a.col - b.col) === 1) {
      const c = Math.min(a.col, b.col);
      colGapAfter.set(c, Math.max(colGapAfter.get(c) || 0, labelW));
    } else if (a.col === b.col && Math.abs(a.row - b.row) === 1) {
      const r = Math.min(a.row, b.row);
      rowGapAfter.set(r, Math.max(rowGapAfter.get(r) || 0, labelH));
    }
  }

  const centers = (sizes, gapAfter, baseGap) => {
    const keys = [...sizes.keys()];
    const min = Math.min(...keys);
    const max = Math.max(...keys);
    const result = new Map();
    let cursor = 0;
    for (let k = min; k <= max; k++) {
      const size = sizes.get(k) || 0; // columnas/filas vacías no ocupan espacio
      result.set(k, cursor + size / 2);
      if (sizes.has(k)) cursor += size + Math.max(baseGap, gapAfter.get(k) || 0);
    }
    return result;
  };

  const colX = centers(colWidth, colGapAfter, opts.colGap);
  const rowY = centers(rowHeight, rowGapAfter, opts.rowGap);

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const n of nodes.values()) {
    n.x = colX.get(n.col);
    n.y = rowY.get(n.row);
    minX = Math.min(minX, n.x - n.w / 2);
    maxX = Math.max(maxX, n.x + n.w / 2);
    minY = Math.min(minY, n.y - n.h / 2);
    maxY = Math.max(maxY, n.y + n.h / 2);
  }
  if (!nodes.size) minX = minY = maxX = maxY = 0;
  return { minX, minY, maxX, maxY };
}

// ---------------------------------------------------------------- aristas

// Distancia del centro al borde de la forma en la dirección (ux, uy) unitaria.
function borderDistance(node, ux, uy) {
  const hw = node.w / 2;
  const hh = node.h / 2;
  const ax = Math.abs(ux);
  const ay = Math.abs(uy);
  switch (node.shape) {
    case "circle":
      return hw;
    case "diamond":
      return 1 / (ax / hw + ay / hh);
    case "parallelogram":
    case "parallelogram-alt": {
      // A media altura los lados inclinados quedan a skew/2 hacia dentro.
      const sx = hw - node.skew / 2;
      return Math.min(ax ? sx / ax : Infinity, ay ? hh / ay : Infinity);
    }
    default:
      return Math.min(ax ? hw / ax : Infinity, ay ? hh / ay : Infinity);
  }
}

function routeEdge(edge, a, b, measure, opts) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len;
  const uy = dy / len;
  const da = borderDistance(a, ux, uy);
  const db = borderDistance(b, ux, uy);
  edge.points = [
    { x: a.x + ux * da, y: a.y + uy * da },
    { x: b.x - ux * db, y: b.y - uy * db },
  ];
  if (edge.label) {
    const [p, q] = edge.points;
    const tm = textMetrics(edge.css, measure, opts);
    const lines = edge.label.split("\n"); // "<br>" en la etiqueta: varias líneas
    edge.labelBox = {
      x: (p.x + q.x) / 2,
      y: (p.y + q.y) / 2,
      w: Math.max(...lines.map((l) => tm.measure(l))) + 12,
      h: tm.lineHeight * lines.length + 4,
      lineHeight: tm.lineHeight,
    };
  }
}

if (typeof module !== "undefined") module.exports = { layoutDiagram, wrapText, LAYOUT_DEFAULTS };

// Render: resultado del layout -> texto SVG autocontenido (estilos en línea, listo para exportar).

const THEME = {
  background: null, // null = transparente: el diagrama se funde con el fondo del visor
  nodeFill: "#ffffff",
  nodeStroke: "#1f2328",
  nodeStrokeWidth: 1.5,
  text: "#1f2328",
  edge: "#1f2328",
  edgeWidth: 1.5,
  labelText: "#1f2328",
  labelBackground: "#ffffff",
  title: "#656d76", // título de cada subgraph, encima de su diagrama
  refDash: "5 3", // borde de los nodos de referencia a otro diagrama
  // Pastilla con el id de cada nodo, en su esquina superior izquierda (renderSvg con { ids: true }).
  // (las medidas deben coincidir con PILL_FONT / PILL_HEIGHT de layout.js, que reserva el sitio de
  // los empalmes)
  idPill: { fill: "#57606a", text: "#ffffff", fontSize: 12, height: 18 },
  padding: 40,
  // Sombra difuminada bajo todas las formas. null = sin sombra.
  shadow: { dx: 0, dy: 1, blur: 1.5, color: "#000000", opacity: 0.18 },
};

function escapeXml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

const fmt = (n) => Number(n.toFixed(2));

// css de Mermaid ([[prop, valor], ...]) -> atributo style. El CSS de style gana a los atributos
// de presentación (fill="..."), así que lo que no se indique queda con los valores del tema.
const styleAttr = (css) => (css && css.length ? ` style="${escapeXml(css.map(([k, v]) => `${k}:${v}`).join(";"))}"` : "");

// Reparte el css de un nodo: el texto recibe las propiedades de fuente y "color" (que en SVG es
// el relleno del texto), el grupo la opacidad, y la forma todo lo demás.
function splitCss(css = []) {
  const shape = [];
  const text = [];
  const group = [];
  for (const [k, v] of css) {
    if (k === "color") text.push(["fill", v]);
    else if (/^(font|letter|word|text)-/.test(k)) text.push([k, v]);
    else if (k === "opacity") group.push([k, v]);
    else shape.push([k, v]);
  }
  return { shape, text, group };
}
const cssValue = (css, key) => {
  const hit = (css || []).filter(([k]) => k === key).pop();
  return hit && hit[1];
};

// Área del SVG: la caja del layout más el margen.
function frame(layout, theme) {
  const { bounds } = layout;
  const pad = theme.padding;
  const x0 = bounds.minX - pad;
  const y0 = bounds.minY - pad;
  const width = bounds.maxX - bounds.minX + 2 * pad;
  const height = bounds.maxY - bounds.minY + 2 * pad;
  const open = (attrs = "") =>
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${fmt(x0)} ${fmt(y0)} ${fmt(width)} ${fmt(height)}" ` +
    `width="${fmt(width)}" height="${fmt(height)}"${attrs}>`;
  return { x0, y0, width, height, open };
}

// Con { shadow: false } se omite la sombra: el visor la dibuja aparte (ver renderShadowSvg).
// Con { ids: true } cada nodo lleva una pastilla con su id.
function renderSvg(layout, theme = THEME, { shadow = true, ids = false } = {}) {
  const { nodes, edges, options: opts } = layout;
  const f = frame(layout, theme);
  // Una punta de flecha por cada color de línea (el marcador no hereda el color de la línea).
  const markers = new Map([[theme.edge, "arrow"]]);
  for (const e of edges) {
    const c = cssValue(e.css, "stroke");
    if (c && !markers.has(c)) markers.set(c, `arrow-${markers.size}`);
  }

  const parts = [];
  parts.push(f.open(` font-family="${escapeXml(opts.fontFamily)}" font-size="${opts.fontSize}"`));
  parts.push(
    `<defs>` +
      [...markers]
        // Una punta para el final y otra invertida para el inicio (flechas <-->), con orient="auto":
        // "auto-start-reverse" es de SVG 2 y algunos programas (p. ej. resvg) no lo entienden.
        .map(
          ([color, id]) =>
            `<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" ` +
            `markerUnits="userSpaceOnUse" orient="auto">` +
            `<path d="M0,0 L10,5 L0,10 z" fill="${escapeXml(color)}"/></marker>` +
            `<marker id="${id}-inicio" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" ` +
            `markerUnits="userSpaceOnUse" orient="auto">` +
            `<path d="M10,0 L0,5 L10,10 z" fill="${escapeXml(color)}"/></marker>`
        )
        .join("") +
      (theme.shadow && shadow ? shadowFilter(f, theme.shadow) : "") +
      `</defs>`
  );
  if (theme.background) {
    parts.push(`<rect x="${fmt(f.x0)}" y="${fmt(f.y0)}" width="${fmt(f.width)}" height="${fmt(f.height)}" fill="${theme.background}"/>`);
  }

  if (theme.shadow && shadow) parts.push(renderShadows(layout, theme));

  // Aristas debajo de los nodos, etiquetas encima de todo.
  parts.push(`<g class="edges">`);
  for (const e of edges) parts.push(renderEdge(e, theme, markers.get(cssValue(e.css, "stroke") || theme.edge)));
  parts.push(`</g><g class="nodes">`);
  for (const n of nodes) parts.push(renderNode(n, theme, opts));
  parts.push(`</g><g class="labels">`);
  for (const e of edges) if (e.labelBox) parts.push(renderLabel(e, theme));
  parts.push(`</g>`);
  if (layout.titles && layout.titles.length) {
    parts.push(`<g class="titles">`);
    for (const t of layout.titles) {
      parts.push(
        `<text x="${fmt(t.x)}" y="${fmt(t.y)}" dominant-baseline="central" font-weight="600" fill="${theme.title}">` +
          `${escapeXml(t.text)}</text>`
      );
    }
    parts.push(`</g>`);
  }
  if (ids) parts.push(renderIdPills(nodes, theme));
  parts.push(`</svg>`);
  return parts.join("\n");
}

// Solo la sombra, como SVG del mismo tamaño que el diagrama. El visor la pinta una vez en un
// mapa de bits y la pone debajo del SVG sin sombra: un filtro de desenfoque dentro del SVG se
// recalcula en cada repintado y con zoom alto hacía caer los fps; el mapa de bits solo se escala
// (al ser difusa no se nota la pérdida de resolución).
function renderShadowSvg(layout, theme = THEME) {
  const f = frame(layout, theme);
  return `${f.open()}<defs>${shadowFilter(f, theme.shadow)}</defs>${renderShadows(layout, theme)}</svg>`;
}

// Región del filtro en coordenadas del diagrama: con la predeterminada (relativa a la caja del
// elemento) una línea recta horizontal o vertical tiene alto o ancho 0 y desaparece.
function shadowFilter(f, sh) {
  return (
    `<filter id="shadow" filterUnits="userSpaceOnUse" x="${fmt(f.x0)}" y="${fmt(f.y0)}" ` +
    `width="${fmt(f.width)}" height="${fmt(f.height)}"><feGaussianBlur stdDeviation="${sh.blur}"/></filter>`
  );
}

// Copia de todas las formas en el color de la sombra, desplazada y difuminada. Va en un solo
// grupo debajo del resto, así nunca tapa una línea o un nodo.
function renderShadows({ nodes, edges }, theme) {
  const sh = theme.shadow;
  const edgeTheme = { ...theme, edge: sh.color };
  const style = `fill="${sh.color}" stroke="${sh.color}" stroke-width="${theme.nodeStrokeWidth}"`;
  const parts = [
    `<g class="shadows" transform="translate(${sh.dx} ${sh.dy})" opacity="${sh.opacity}" filter="url(#shadow)">`,
  ];
  // La sombra solo copia la geometría: del css de la línea, solo el grosor.
  for (const e of edges) {
    const css = (e.css || []).filter(([k]) => k === "stroke-width");
    parts.push(renderEdge({ ...e, css, arrowStart: false, arrowEnd: false }, edgeTheme));
  }
  const arc = `fill="none" stroke="${sh.color}" stroke-width="${theme.nodeStrokeWidth}"`;
  for (const n of nodes) parts.push(nodeShape(n, style, arc));
  for (const e of edges) {
    if (!e.labelBox) continue;
    const b = e.labelBox;
    parts.push(`<rect x="${fmt(b.x - b.w / 2)}" y="${fmt(b.y - b.h / 2)}" width="${fmt(b.w)}" height="${fmt(b.h)}" rx="3" ${style}/>`);
  }
  parts.push(`</g>`);
  return parts.join("");
}

// Pastillas encima de todo, centradas en la esquina superior izquierda de la caja de cada nodo.
// Referencias y nodos absorbidos muestran el id del nodo real. Los empalmes no llevan: son ellos
// mismos una pastilla con el id de su dueño.
function renderIdPills(nodes, theme) {
  const p = theme.idPill;
  const parts = [`<g class="ids" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="${p.fontSize}">`];
  for (const n of nodes) {
    if (n.shape === "junction") continue; // el empalme ya es una pastilla (renderNode)
    const id = n.realId || n.id;
    const w = id.length * p.fontSize * 0.62 + 8; // monoespaciada: ancho fijo por carácter
    const { x, y, centered } = pillAnchor(n);
    const left = centered ? x - w / 2 : x - 4;
    parts.push(
      `<g class="id-pill" data-id="${escapeXml(n.id)}"><rect x="${fmt(left)}" y="${fmt(y - p.height / 2)}" width="${fmt(w)}" height="${p.height}" ` +
        `rx="${p.height / 2}" fill="${p.fill}"/>` +
        `<text x="${fmt(left + w / 2)}" y="${fmt(y)}" text-anchor="middle" dominant-baseline="central" fill="${p.text}">` +
        `${escapeXml(id)}</text></g>`
    );
  }
  parts.push(`</g>`);
  return parts.join("");
}

// Punto del contorno de la forma donde se ancla su pastilla: la "esquina superior izquierda" de la
// forma real. En rombos y círculos esa esquina está en un lado inclinado, así que la pastilla se
// centra sobre ella; en las demás empieza en la esquina.
function pillAnchor(n) {
  const hw = n.w / 2;
  const hh = n.h / 2;
  switch (n.shape) {
    case "diamond":
      return { x: n.x - hw / 2, y: n.y - hh / 2, centered: true };
    case "circle":
      return { x: n.x - hw * Math.SQRT1_2, y: n.y - hh * Math.SQRT1_2, centered: true };
    case "hexagon":
    case "parallelogram":
      return { x: n.x - hw + n.skew, y: n.y - hh };
    default:
      return { x: n.x - hw, y: n.y - hh };
  }
}

function renderEdge(e, theme, marker = "arrow") {
  const [p, q] = e.points;
  const width = e.style === "thick" ? theme.edgeWidth * 2 : theme.edgeWidth;
  const dash = e.style === "dotted" ? ` stroke-dasharray="4 4"` : "";
  const start = e.arrowStart ? ` marker-start="url(#${marker}-inicio)"` : "";
  const end = e.arrowEnd ? ` marker-end="url(#${marker})"` : "";
  // "color" de linkStyle es el color de la etiqueta, no de la línea.
  const css = (e.css || []).filter(([k]) => k !== "color" && !/^(font|letter|word|text)-/.test(k));
  return (
    `<line data-from="${escapeXml(e.from)}" data-to="${escapeXml(e.to)}" x1="${fmt(p.x)}" y1="${fmt(p.y)}" ` +
    `x2="${fmt(q.x)}" y2="${fmt(q.y)}" stroke="${theme.edge}" stroke-width="${width}"${dash}${start}${end}${styleAttr(css)}/>`
  );
}

function renderNode(n, theme, opts) {
  // Empalme: una pastilla con el id de su dueño ("● A8"); las flechas llegan a su borde.
  if (n.shape === "junction") {
    const p = theme.idPill;
    return (
      `<g class="junction" data-id="${escapeXml(n.id)}">${nodeShape(n, `fill="${p.fill}"`, "")}` +
      `<text x="${fmt(n.x)}" y="${fmt(n.y)}" text-anchor="middle" dominant-baseline="central" fill="${p.text}" ` +
      `font-family="ui-monospace, Menlo, Consolas, monospace" font-size="${p.fontSize}">` +
      `${escapeXml(`\u25cf ${n.junctionOf}`)}</text></g>`
    );
  }
  const css = splitCss(n.css);
  // Las referencias siempre llevan borde discontinuo, aunque su clase diga otra cosa.
  if (n.ref && !n.absorbed) css.shape.push(["stroke-dasharray", theme.refDash]);
  const base = `stroke="${theme.nodeStroke}" stroke-width="${theme.nodeStrokeWidth}"`;
  const style = `fill="${theme.nodeFill}" ${base}${styleAttr(css.shape)}`;
  const arc = `fill="none" ${base}${styleAttr([...css.shape, ["fill", "none"]])}`;
  const shape = nodeShape(n, style, arc);
  // En el cilindro el texto se centra en el cuerpo, bajo la tapa.
  const textY = n.shape === "cylinder" ? n.y + n.w * 0.06 : n.y;
  const text = renderText(n.lines, n.x, textY, theme.text, n.lineHeight || opts.lineHeight, css.text);
  return `<g class="node" data-id="${escapeXml(n.id)}"${styleAttr(css.group)}>${shape}${text}</g>`;
}

// arcStyle: atributos de la tapa del cilindro (una línea sin relleno).
function nodeShape(n, style, arcStyle) {
  const hw = n.w / 2;
  const hh = n.h / 2;
  let shape;
  switch (n.shape) {
    case "circle":
      shape = `<circle cx="${fmt(n.x)}" cy="${fmt(n.y)}" r="${fmt(hw)}" ${style}/>`;
      break;
    case "subroutine": {
      // Subrutina [[ ]]: rectángulo con una línea vertical cerca de cada lado.
      const l = n.x - hw;
      const r = n.x + hw;
      const t = n.y - hh;
      const b = n.y + hh;
      shape =
        `<rect x="${fmt(l)}" y="${fmt(t)}" width="${fmt(n.w)}" height="${fmt(n.h)}" rx="2" ${style}/>` +
        `<path d="M${fmt(l + 10)},${fmt(t)} V${fmt(b)} M${fmt(r - 10)},${fmt(t)} V${fmt(b)}" ${arcStyle}/>`;
      break;
    }
    case "junction":
      shape = `<rect x="${fmt(n.x - hw)}" y="${fmt(n.y - hh)}" width="${fmt(n.w)}" height="${fmt(n.h)}" rx="${fmt(hh)}" ${style}/>`;
      break;
    case "diamond":
      shape =
        `<polygon points="${fmt(n.x)},${fmt(n.y - hh)} ${fmt(n.x + hw)},${fmt(n.y)} ` +
        `${fmt(n.x)},${fmt(n.y + hh)} ${fmt(n.x - hw)},${fmt(n.y)}" ${style}/>`;
      break;
    case "hexagon": {
      const k = n.skew;
      const pts = [
        [n.x - hw + k, n.y - hh], [n.x + hw - k, n.y - hh], [n.x + hw, n.y],
        [n.x + hw - k, n.y + hh], [n.x - hw + k, n.y + hh], [n.x - hw, n.y],
      ];
      shape = `<polygon points="${pts.map(([x, y]) => `${fmt(x)},${fmt(y)}`).join(" ")}" ${style}/>`;
      break;
    }
    case "parallelogram":
    case "parallelogram-alt": {
      const l = n.x - hw;
      const r = n.x + hw;
      const t = n.y - hh;
      const b = n.y + hh;
      const k = n.skew;
      // parallelogram = [/ /] (inclinado a la derecha); alt = [\ \] (a la izquierda).
      const pts =
        n.shape === "parallelogram"
          ? [[l + k, t], [r, t], [r - k, b], [l, b]]
          : [[l, t], [r - k, t], [r, b], [l + k, b]];
      shape = `<polygon points="${pts.map(([x, y]) => `${fmt(x)},${fmt(y)}`).join(" ")}" ${style}/>`;
      break;
    }
    case "cylinder": {
      const ry = n.w * 0.12;
      const top = n.y - hh + ry;
      const bottom = n.y + hh - ry;
      const l = n.x - hw;
      const r = n.x + hw;
      shape =
        `<path d="M${fmt(l)},${fmt(top)} L${fmt(l)},${fmt(bottom)} A${fmt(hw)},${fmt(ry)} 0 0 0 ${fmt(r)},${fmt(bottom)} ` +
        `L${fmt(r)},${fmt(top)} A${fmt(hw)},${fmt(ry)} 0 0 0 ${fmt(l)},${fmt(top)} Z" ${style}/>` +
        `<path d="M${fmt(l)},${fmt(top)} A${fmt(hw)},${fmt(ry)} 0 0 0 ${fmt(r)},${fmt(top)}" ${arcStyle}/>`;
      break;
    }
    default: {
      const rx = n.shape === "stadium" ? hh : n.shape === "round" ? 12 : 2;
      shape = `<rect x="${fmt(n.x - hw)}" y="${fmt(n.y - hh)}" width="${fmt(n.w)}" height="${fmt(n.h)}" rx="${rx}" ${style}/>`;
    }
  }
  return shape;
}

function renderText(lines, x, y, color, lineHeight, css) {
  const firstY = y - ((lines.length - 1) * lineHeight) / 2;
  const spans = lines
    .map((l, i) => `<tspan x="${fmt(x)}" y="${fmt(firstY + i * lineHeight)}">${escapeXml(l)}</tspan>`)
    .join("");
  return `<text text-anchor="middle" dominant-baseline="central" fill="${color}"${styleAttr(css)}>${spans}</text>`;
}

// Una línea: el texto tal cual; varias ("<br>"): una por tspan, centradas en la caja.
function labelSpans(label, b) {
  const lines = label.split("\n");
  if (lines.length === 1) return escapeXml(label);
  const lh = b.lineHeight || 18;
  const first = b.y - ((lines.length - 1) * lh) / 2;
  return lines.map((l, i) => `<tspan x="${fmt(b.x)}" y="${fmt(first + i * lh)}">${escapeXml(l)}</tspan>`).join("");
}

function renderLabel(e, theme) {
  const b = e.labelBox;
  return (
    `<g class="label" data-from="${escapeXml(e.from)}" data-to="${escapeXml(e.to)}"><rect x="${fmt(b.x - b.w / 2)}" y="${fmt(b.y - b.h / 2)}" width="${fmt(b.w)}" height="${fmt(b.h)}" ` +
    `rx="3" fill="${theme.labelBackground}"/>` +
    `<text x="${fmt(b.x)}" y="${fmt(b.y)}" text-anchor="middle" dominant-baseline="central" fill="${theme.labelText}"` +
    `${styleAttr(splitCss(e.css).text)}>` +
    labelSpans(e.label, b) +
    `</text></g>`
  );
}

if (typeof module !== "undefined") module.exports = { renderSvg, renderShadowSvg, THEME };

// Visor: monta el diagrama en la página, zoom con la rueda, arrastre, gestos táctiles y exportación.
// Con `live` (diagram.py --watch) pide al servidor el código nuevo cuando cambia el .mmd y vuelve
// a dibujar sin recargar la pestaña.

const DiagramViewer = (() => {
  const MIN_SCALE = 0.1;
  const MAX_SCALE = 8;

  function start({ source: initialSource, title, live }) {
    const stage = document.getElementById("stage");
    const canvas = document.getElementById("canvas");
    const status = document.getElementById("status");
    document.title = title;

    // Estado del diagrama montado; mount() lo reemplaza entero cuando llega código nuevo.
    // Si el código tiene un error, result queda en null y los controles no hacen nada.
    let source = initialSource;
    let result = null;
    let svg = null;
    let size = null;
    let generation = 0; // para descartar la sombra de un montaje anterior que llegue tarde

    // ---- vista: translate(tx, ty) scale(s) con origen arriba a la izquierda
    const view = { s: 1, tx: 0, ty: 0 };
    const apply = () => {
      canvas.style.transform = `translate(${view.tx}px, ${view.ty}px) scale(${view.s})`;
      // La cuadrícula de puntos del fondo se mueve y escala con el diagrama.
      const grid = 24 * view.s;
      stage.style.backgroundSize = `${grid}px ${grid}px`;
      stage.style.backgroundPosition = `${view.tx}px ${view.ty}px`;
      status.textContent = `${Math.round(view.s * 100)}%`;
    };
    const fit = () => {
      if (!size) return;
      const r = stage.getBoundingClientRect();
      view.s = Math.min(r.width / size.w, r.height / size.h, 1);
      view.tx = (r.width - size.w * view.s) / 2;
      view.ty = (r.height - size.h * view.s) / 2;
      apply();
    };
    const zoomAt = (factor, cx, cy) => {
      const s = clamp(view.s * factor, MIN_SCALE, MAX_SCALE);
      const f = s / view.s;
      view.tx = cx - (cx - view.tx) * f;
      view.ty = cy - (cy - view.ty) * f;
      view.s = s;
      apply();
    };
    const center = () => {
      const r = stage.getBoundingClientRect();
      return [r.width / 2, r.height / 2];
    };

    // Mientras hay un gesto en curso el diagrama se sube a su propia capa (will-change) y el
    // navegador solo mueve/escala esa imagen, sin volver a pintar el SVG (y sus sombras) en
    // cada fotograma. Al terminar se quita para que se vuelva a pintar nítido a la escala final.
    let motionTimer = 0;
    const beginMotion = () => {
      clearTimeout(motionTimer);
      canvas.style.willChange = "transform";
    };
    const endMotion = () => {
      clearTimeout(motionTimer);
      motionTimer = setTimeout(() => (canvas.style.willChange = ""), 150);
    };

    stage.addEventListener(
      "wheel",
      (ev) => {
        ev.preventDefault();
        beginMotion();
        endMotion();
        const r = stage.getBoundingClientRect();
        // deltaMode 1 = líneas (algunos ratones); se normaliza a píxeles.
        const delta = ev.deltaY * (ev.deltaMode === 1 ? 16 : 1);
        zoomAt(Math.exp(-delta * 0.0015), ev.clientX - r.left, ev.clientY - r.top);
      },
      { passive: false }
    );

    // ---- gestos: un dedo (o ratón) arrastra; dos dedos hacen zoom y arrastran a la vez.
    // Se usa el centro y la separación de los dos primeros punteros: en cada movimiento el
    // diagrama se desplaza lo que se movió el centro y se escala lo que cambió la separación.
    const pointers = new Map();
    let gesture = null; // { x, y, d } del último movimiento
    let lastTap = { time: 0, x: 0, y: 0 };
    let tapStart = null;
    const snapshot = () => {
      const pts = [...pointers.values()].slice(0, 2);
      const r = stage.getBoundingClientRect();
      const x = pts.reduce((acc, p) => acc + p.x, 0) / pts.length - r.left;
      const y = pts.reduce((acc, p) => acc + p.y, 0) / pts.length - r.top;
      const d = pts.length === 2 ? Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1 : 0;
      return { x, y, d };
    };
    stage.addEventListener("pointerdown", (ev) => {
      if (ev.pointerType === "mouse" && ev.button !== 0) return;
      stage.setPointerCapture(ev.pointerId);
      pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      stage.classList.add("dragging");
      beginMotion();
      gesture = snapshot();
      tapStart = pointers.size === 1 ? { x: ev.clientX, y: ev.clientY, time: ev.timeStamp } : null;
    });
    stage.addEventListener("pointermove", (ev) => {
      if (!pointers.has(ev.pointerId)) return;
      pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      const g = snapshot();
      view.tx += g.x - gesture.x;
      view.ty += g.y - gesture.y;
      if (g.d && gesture.d) zoomAt(g.d / gesture.d, g.x, g.y);
      else apply();
      gesture = g;
    });
    const release = (ev) => {
      if (!pointers.delete(ev.pointerId)) return;
      if (pointers.size) gesture = snapshot();
      else {
        stage.classList.remove("dragging");
        endMotion();
      }
      // Doble toque (táctil) = ajustar; en ratón ya lo cubre dblclick.
      if (ev.type === "pointerup" && ev.pointerType !== "mouse" && tapStart && !pointers.size) {
        const moved = Math.hypot(ev.clientX - tapStart.x, ev.clientY - tapStart.y);
        const quick = ev.timeStamp - tapStart.time < 300;
        if (moved < 10 && quick) {
          const near = Math.hypot(ev.clientX - lastTap.x, ev.clientY - lastTap.y) < 40;
          if (ev.timeStamp - lastTap.time < 350 && near) {
            fit();
            lastTap.time = 0;
          } else {
            lastTap = { time: ev.timeStamp, x: ev.clientX, y: ev.clientY };
          }
        }
      }
      if (!pointers.size) tapStart = null;
    };
    stage.addEventListener("pointerup", release);
    stage.addEventListener("pointercancel", release);
    stage.addEventListener("dblclick", fit);

    // ---- teclado y botones
    window.addEventListener("keydown", (ev) => {
      if (ev.key === "0") fit();
      else if (ev.key === "+" || ev.key === "=") zoomAt(1.2, ...center());
      else if (ev.key === "-") zoomAt(1 / 1.2, ...center());
    });
    document.getElementById("btn-mermaid").onclick = () => openInMermaid(source, title);
    // ---- depuración: ver cómo se construye el diagrama, nodo a nodo, en el orden en que el layout
    // los colocó (n.step) y con el motivo (n.why). Una flecha aparece cuando sus dos extremos están.
    let order = [];
    let total = 0;
    let shown = 0;
    const stepLabel = document.getElementById("step-label");
    const stepWhy = document.getElementById("step-why");
    const shadowCanvas = () => canvas.querySelector("canvas.shadow");
    // En un paso intermedio se dibuja el diagrama tal como estaba al terminar ese paso
    // (result.snapshotAt): las inserciones de filas/columnas y los nodos movidos aparecen en el
    // paso que los provocó. Para que el dibujo no salte, el primer nodo se mantiene fijo en pantalla.
    let shownSvg = null;
    let shownLayout = null;
    let anchorId = null;
    const localPos = (layout, el, id) => {
      const n = layout.nodes.find((x) => x.id === id);
      const vb = el.viewBox.baseVal;
      return n && { x: n.x - vb.x, y: n.y - vb.y };
    };
    const showLayout = (layout, el) => {
      const before = localPos(shownLayout, shownSvg, anchorId);
      if (el !== shownSvg) shownSvg.replaceWith(el);
      const after = localPos(layout, el, anchorId);
      if (before && after) {
        view.tx += (before.x - after.x) * view.s;
        view.ty += (before.y - after.y) * view.s;
        apply();
      }
      shownSvg = el;
      shownLayout = layout;
    };
    const showStep = (k) => {
      if (!result) return;
      shown = Math.max(1, Math.min(total, k));
      const all = shown === total;
      const current = all ? null : order[shown - 1];
      if (all) showLayout(result, svg);
      else {
        const snap = result.snapshotAt(shown - 1);
        const tmp = document.createElement("div");
        tmp.innerHTML = renderSvg(snap, THEME, { shadow: false, ids: true });
        showLayout(snap, tmp.firstElementChild);
        const el = shownSvg.querySelector(`g.node[data-id="${CSS.escape(current.id)}"], g.junction[data-id="${CSS.escape(current.id)}"]`);
        if (el) el.classList.add("step-current");
      }
      const sh = shadowCanvas();
      if (sh) sh.style.display = all ? "" : "none"; // la sombra es la del diagrama final
      stepLabel.textContent = `${shown} / ${total}`;
      stepWhy.textContent = current ? `${current.realId || current.junctionOf || current.id}: ${current.why}` : "";
      if (current) keepVisible(shownLayout.nodes.find((n) => n.id === current.id) || current);
    };
    const keepVisible = (n) => {
      const vb = shownSvg.viewBox.baseVal;
      const r = stage.getBoundingClientRect();
      const sx = view.tx + (n.x - vb.x) * view.s;
      const sy = view.ty + (n.y - vb.y) * view.s;
      if (sx < 40 || sx > r.width - 40 || sy < 120 || sy > r.height - 60) {
        view.tx = r.width / 2 - (n.x - vb.x) * view.s;
        view.ty = r.height / 2 - (n.y - vb.y) * view.s;
        apply();
      }
    };
    document.getElementById("btn-step-prev").onclick = () => showStep(shown - 1);
    document.getElementById("btn-step-next").onclick = () => showStep(shown + 1);
    window.addEventListener("keydown", (ev) => {
      if (ev.key === "ArrowLeft") showStep(shown - 1);
      else if (ev.key === "ArrowRight") showStep(shown + 1);
      else if (ev.key === "Home") showStep(1);
      else if (ev.key === "End") showStep(total);
    });

    // ---- tocar la pastilla de un empalme (o conector) lleva, con una animación, hasta su nodo
    // dueño, que parpadea. Si hay copias de ese nodo, va al original. Un arrastre no cuenta.
    let downAt = null;
    // El elemento tocado se guarda al apoyar el dedo: el arrastre captura el puntero y el click
    // posterior llega al lienzo, no a la pastilla.
    stage.addEventListener("pointerdown", (ev) => (downAt = { x: ev.clientX, y: ev.clientY, target: ev.target }), true);
    stage.addEventListener("click", (ev) => {
      if (downAt && Math.hypot(ev.clientX - downAt.x, ev.clientY - downAt.y) > 6) return;
      const t = downAt && downAt.target;
      const pill = t && t.closest && t.closest("g.junction");
      if (!pill || !shownLayout) return;
      const j = shownLayout.nodes.find((n) => n.id === pill.dataset.id);
      if (!j) return;
      const owner = j.junctionOf;
      const candidates = shownLayout.nodes.filter((n) => n.shape !== "junction" && (n.realId || n.id) === owner);
      const target = candidates.find((n) => n.id === owner) || candidates.find((n) => !n.copyOf) || candidates[0];
      if (target) flyTo(target);
    });
    let flight = 0;
    const flyTo = (n) => {
      const vb = shownSvg.viewBox.baseVal;
      const r = stage.getBoundingClientRect();
      const from = { tx: view.tx, ty: view.ty };
      const to = { tx: r.width / 2 - (n.x - vb.x) * view.s, ty: r.height / 2 - (n.y - vb.y) * view.s };
      const start = performance.now();
      const id = ++flight;
      const frame = (now) => {
        if (id !== flight) return; // otro toque empezó otra animación
        const t = Math.min(1, (now - start) / 450);
        const k = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; // suave al salir y al llegar
        view.tx = from.tx + (to.tx - from.tx) * k;
        view.ty = from.ty + (to.ty - from.ty) * k;
        apply();
        if (t < 1) requestAnimationFrame(frame);
        else flash(n.id);
      };
      requestAnimationFrame(frame);
    };
    const flash = (id) => {
      const el = shownSvg.querySelector(`g.node[data-id="${CSS.escape(id)}"]`);
      if (!el) return;
      el.classList.remove("flash");
      void el.getBoundingClientRect(); // reinicia la animación si ya estaba
      el.classList.add("flash");
      setTimeout(() => el.classList.remove("flash"), 1300);
    };

    // Lo exportado sale como se ve (pastillas incluidas: los empalmes se refieren a los nodos por su
    // id), con la sombra difuminada real dentro del SVG.
    const exportSvg = () => renderSvg(result, THEME, { ids: true });
    document.getElementById("btn-svg").onclick = () =>
      result && download(new Blob([exportSvg()], { type: "image/svg+xml" }), `${title}.svg`);
    document.getElementById("btn-png").onclick = () => result && exportPng(exportSvg(), size, title);

    // En móvil "resize" salta cada vez que aparece o se oculta la barra del navegador:
    // se conserva el punto que estaba en el centro en lugar de volver a ajustar.
    let stageSize = stage.getBoundingClientRect();
    window.addEventListener("resize", () => {
      const r = stage.getBoundingClientRect();
      view.tx += (r.width - stageSize.width) / 2;
      view.ty += (r.height - stageSize.height) / 2;
      stageSize = r;
      apply();
    });

    // ---- montar (o volver a montar) el diagrama a partir de su código.
    // Al volver a montar se conserva la vista (zoom y desplazamiento) sin re-ajustar; para que el
    // dibujo no salte si el diagrama crece por arriba o por la izquierda, el primer nodo colocado
    // se mantiene en el mismo punto de la pantalla (como en el paso a paso). Si se estaba en un
    // paso intermedio se vuelve al diagrama completo: con otro código los pasos ya no son los
    // mismos (cambian el orden y el número de nodos) y conservar el número confundiría.
    let fitted = false;
    const mount = (src) => {
      source = src;
      let next;
      try {
        const graph = parseDiagram(src);
        next = layoutDiagram(graph, { measure: makeMeasure() });
      } catch (err) {
        result = null;
        showError(err, src);
        return;
      }
      hideError();
      const nextOrder = [...next.nodes].sort((a, b) => a.step - b.step);
      const nextAnchor = nextOrder[0] && nextOrder[0].id;
      const before = shownSvg && shownSvg.isConnected ? localPos(shownLayout, shownSvg, nextAnchor) : null;

      result = next;
      generation++;
      canvas.innerHTML = renderSvg(result, THEME, { shadow: false, ids: true });
      svg = canvas.querySelector("svg");
      size = { w: parseFloat(svg.getAttribute("width")), h: parseFloat(svg.getAttribute("height")) };
      if (THEME.shadow) {
        const gen = generation;
        paintShadow(renderShadowSvg(result), size, canvas, () => gen === generation);
      }
      showWarnings(result.warnings);

      order = nextOrder;
      total = order.length;
      anchorId = nextAnchor;
      shownSvg = svg;
      shownLayout = result;
      const after = before && localPos(result, svg, anchorId);
      if (after) {
        view.tx += (before.x - after.x) * view.s;
        view.ty += (before.y - after.y) * view.s;
      }
      showStep(total);
      if (!fitted) fit();
      else apply();
      fitted = true;
    };
    mount(initialSource);
    if (live) watchSource(live.version, mount);
  }

  // ---- recarga en vivo: se pregunta al servidor cada segundo si hay una versión nueva del código
  // (GET /source?v=N responde 204 si sigue igual, o {version, source} si cambió). Es un sondeo
  // corto y no SSE ni una petición larga porque es lo más robusto en móvil: si el navegador
  // congela la pestaña en segundo plano o el servidor se reinicia, la siguiente petición sin más
  // vuelve a funcionar. Con la pestaña oculta no se pregunta; al volver se pregunta enseguida.
  function watchSource(version, onChange) {
    const badge = document.getElementById("live");
    const POLL_MS = 1000;
    let timer = 0;
    let busy = false;
    const setOnline = (ok) => {
      badge.hidden = false;
      badge.classList.toggle("off", !ok);
      badge.textContent = ok ? "● en vivo" : "○ sin conexión";
      badge.title = ok
        ? "Recarga en vivo: el diagrama se actualiza al guardar el .mmd"
        : "No se puede contactar con diagram.py --watch; se sigue intentando";
    };
    const check = async () => {
      clearTimeout(timer);
      if (busy) return;
      busy = true;
      try {
        const res = await fetch(`source?v=${version}`, { cache: "no-store" });
        if (res.status === 200) {
          const data = await res.json();
          version = data.version;
          onChange(data.source);
        } else if (res.status !== 204) throw new Error(`HTTP ${res.status}`);
        setOnline(true);
      } catch (err) {
        setOnline(false);
      } finally {
        busy = false;
        if (!document.hidden) timer = setTimeout(check, POLL_MS);
      }
    };
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) check();
      else clearTimeout(timer);
    });
    setOnline(true);
    check();
  }

  // Pinta la sombra una sola vez en un <canvas> debajo del SVG (ver renderShadowSvg en render.js).
  // Resolución: hasta 3 px por unidad, limitada a ~6 Mpx para no gastar memoria en diagramas grandes.
  // isCurrent: si ya se montó otro diagrama cuando la imagen termina de cargar, no se añade.
  function paintShadow(shadowSvg, size, parent, isCurrent = () => true) {
    const k = Math.min(3, Math.sqrt(6e6 / (size.w * size.h)));
    const c = document.createElement("canvas");
    c.className = "shadow";
    c.width = Math.ceil(size.w * k);
    c.height = Math.ceil(size.h * k);
    c.style.width = `${size.w}px`;
    c.style.height = `${size.h}px`;
    const url = URL.createObjectURL(new Blob([shadowSvg], { type: "image/svg+xml" }));
    const img = new Image();
    img.onload = () => {
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      if (isCurrent()) parent.prepend(c);
    };
    img.src = url;
  }

  // Abre el mismo código en una pestaña nueva dibujado con Mermaid oficial (librería desde
  // jsDelivr; hace falta internet), para comparar. Ahí funciona el zoom normal del navegador.
  function openInMermaid(source, title) {
    const esc = (t) => t.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
    const page = `<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${esc(title)} · Mermaid</title>
<style>
  body { margin: 0; padding: 16px; background: #f4f5f7; color: #1f2328; font: 14px system-ui, sans-serif; }
  .mermaid svg { max-width: none !important; height: auto; }
  #msg { color: #656d76; }
</style></head><body>
<p id="msg">Mermaid oficial · cargando…</p>
<pre class="mermaid">${esc(source)}</pre>
<script type="module">
  const msg = document.getElementById("msg");
  try {
    const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs");
    mermaid.initialize({ startOnLoad: false, securityLevel: "strict" });
    await mermaid.run();
    msg.textContent = "Mermaid oficial";
  } catch (err) {
    msg.textContent = "No se pudo cargar o dibujar con Mermaid (¿sin internet?): " + err.message;
  }
<\/script></body></html>`; // <\/script: si no, cerraría el <script> del HTML generado
    const url = URL.createObjectURL(new Blob([page], { type: "text/html" }));
    window.open(url, "_blank");
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  // Mide texto con la fuente con la que se va a pintar (la del nodo si su estilo la cambia).
  function makeMeasure() {
    const ctx = document.createElement("canvas").getContext("2d");
    const base = `${LAYOUT_DEFAULTS.fontSize}px ${LAYOUT_DEFAULTS.fontFamily}`;
    return (text, font) => {
      ctx.font = base; // si la fuente del nodo no es válida, el canvas la ignora: que no herede la anterior
      if (font) ctx.font = `${font.style} ${font.weight} ${font.size}px ${font.family}`;
      return ctx.measureText(text).width;
    };
  }

  function exportPng(svgText, size, title, scale = 2) {
    const url = URL.createObjectURL(new Blob([svgText], { type: "image/svg+xml" }));
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = Math.ceil(size.w * scale);
      c.height = Math.ceil(size.h * scale);
      const ctx = c.getContext("2d");
      // El SVG no tiene fondo; en el PNG se pinta blanco para que se lea en cualquier visor
      // (muchas galerías muestran lo transparente en negro).
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.scale(scale, scale);
      ctx.drawImage(img, 0, 0, size.w, size.h);
      URL.revokeObjectURL(url);
      c.toBlob((blob) => download(blob, `${title}.png`), "image/png");
    };
    img.src = url;
  }

  function download(blob, filename) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  function showError(err, source) {
    const panel = document.getElementById("error");
    panel.hidden = false;
    panel.querySelector(".message").textContent = err.message;
    const pre = panel.querySelector(".source");
    pre.textContent = ""; // con recarga en vivo el panel puede mostrarse varias veces
    source.split(/\r?\n/).forEach((text, i) => {
      const row = document.createElement("div");
      row.className = i + 1 === err.line ? "line bad" : "line";
      row.dataset.n = i + 1;
      row.textContent = text || " ";
      pre.appendChild(row);
    });
    pre.querySelector(".bad")?.scrollIntoView({ block: "center" });
    if (!(err instanceof DiagramError)) console.error(err);
  }

  function hideError() {
    document.getElementById("error").hidden = true;
  }

  function showWarnings(warnings) {
    const box = document.getElementById("warnings");
    box.hidden = !warnings.length;
    if (!warnings.length) return;
    box.textContent = warnings.map((w) => (w.line ? `Línea ${w.line}: ${w.message}` : w.message)).join("\n");
  }

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  return { start };
})();

</script>
<script>
  DiagramViewer.start({
    source: JSON.parse(document.getElementById("diagram-source").textContent),
    title: "m5",
    live: null,
  });
</script>
</body>
</html>
